# Sprint 1 - app stack. Requires filosign-data_filosign_net from compose.data.yml.
# Dokploy project name: filosign-app

x-filosign-image: &filosign-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: ${FILOSIGN_IMAGE:-filosign/server:local}

# Dokploy project env is NOT auto-injected into containers - list passthrough + ${VAR} here.
# PG_URI, DB_NAME, DEPLOYMENT, S3_*, THIRDWEB_*, … come from Infisical at runtime (entrypoint).
# Optional Dokploy override: set PG_URI + DB_NAME here only if not using Infisical for DB.
x-app-env: &app-env
  DRAGONFLY_URL: redis://dragonfly:6379
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:?set INFISICAL_CLIENT_ID in Dokploy}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:?set INFISICAL_CLIENT_SECRET in Dokploy}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set INFISICAL_PROJECT_ID in Dokploy}
  INFISICAL_ENV: ${INFISICAL_ENV:-prod}
  INFISICAL_API_URL: ${INFISICAL_API_URL:-}
  INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/app}

services:
  api:
    <<: *filosign-image
    restart: unless-stopped
    command: ["./server"]
    environment:
      <<: *app-env
      SERVER_ROLE: api
    # Internal port 3000 only - Dokploy UI binds host :3000. Route public API via Domains (container port 3000).
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - filosign_net

  worker:
    <<: *filosign-image
    restart: unless-stopped
    command: ["./worker"]
    deploy:
      replicas: 1
    # Dokploy: set max replicas / scale = 1 explicitly - UI scale overrides compose.
    healthcheck:
      test: ["CMD", "./worker-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      <<: *app-env
      SERVER_ROLE: worker
    networks:
      - filosign_net

networks:
  filosign_net:
    external: true
    name: filosign-data_filosign_net
