# Sprint 1 — app stack. Requires filosign-data_filosign_net from compose.data.yml.
# Dokploy project name: filosign-app

x-filosign-image: &filosign-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: ${FILOSIGN_IMAGE:-filosign/server:local}

# Dokploy project env is NOT auto-injected into containers — list passthrough + ${VAR} here.
# App secrets (DEPLOYMENT, S3_*, THIRDWEB_*, …) load at runtime via infisical-entrypoint.sh.
x-app-env: &app-env
  DRAGONFLY_URL: redis://dragonfly:6379
  PG_URI: postgresql://${POSTGRES_USER:-filosign}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy}@postgres:5432/:dbname
  DB_NAME: ${POSTGRES_DB:-filosign}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:?set INFISICAL_CLIENT_ID in Dokploy}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:?set INFISICAL_CLIENT_SECRET in Dokploy}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set INFISICAL_PROJECT_ID in Dokploy}
  INFISICAL_ENV: ${INFISICAL_ENV:-prod}
  # EU tenants: INFISICAL_API_URL=https://eu.infisical.com
  INFISICAL_API_URL: ${INFISICAL_API_URL:-}

services:
  api:
    <<: *filosign-image
    container_name: filosign-api
    restart: unless-stopped
    command: ["./server"]
    environment:
      <<: *app-env
      SERVER_ROLE: api
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - filosign_net

  worker:
    <<: *filosign-image
    container_name: filosign-worker
    restart: unless-stopped
    command: ["./worker"]
    deploy:
      replicas: 1
    # Dokploy: set max replicas / scale = 1 explicitly — UI scale overrides compose.
    healthcheck:
      test: ["CMD", "./worker-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      <<: *app-env
      SERVER_ROLE: worker
    networks:
      - filosign_net

networks:
  filosign_net:
    external: true
    name: filosign-data_filosign_net
