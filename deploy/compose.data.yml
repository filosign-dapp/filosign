# Sprint 1 — data stack (Postgres + pgBackRest + Dragonfly). Start before compose.app.yml.
# pgbackrest.conf: copy from pgbackrest/pgbackrest.conf.example (not committed).

services:
  postgres:
    image: postgres:16-alpine
    container_name: filosign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filosign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-filosign}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - filosign_net

  pgbackrest:
    image: pgbackrest/pgbackrest:latest
    container_name: filosign-pgbackrest
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - postgres_data:/var/lib/postgresql/data:ro
    networks:
      - filosign_net

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: filosign-dragonfly
    restart: unless-stopped
    expose:
      - "6379"
    command:
      - --cluster_mode=emulated
      - --lock_on_hashtags
      - --dir=/data
      - --maxmemory=1536mb
    volumes:
      - dragonfly_data:/data
    networks:
      - filosign_net

networks:
  filosign_net:
    name: filosign_net

volumes:
  postgres_data:
  dragonfly_data:
