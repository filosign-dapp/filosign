# Sprint 1 — data stack (Postgres 18 + pgBackRest + Dragonfly). Start before compose.app.yml.
# pgbackrest.conf: copy from pgbackrest/pgbackrest.conf.example (not committed).
# Image pins: deploy/.env.example (optional overrides)
# Dokploy project name: filosign-data

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: ${POSTGRES_IMAGE:-filosign-postgres-pgbackrest:18}
    container_name: filosign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filosign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-filosign}
      PGBACKREST_STANZA: filosign
      PGBACKREST_REPO1_TYPE: s3
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:?set PGBACKREST_REPO1_S3_ENDPOINT}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET:?set PGBACKREST_REPO1_S3_BUCKET}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY:?set PGBACKREST_REPO1_S3_KEY}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET:?set PGBACKREST_REPO1_S3_KEY_SECRET}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_REPO1_S3_REGION:-auto}
      PGBACKREST_REPO1_S3_URI_STYLE: ${PGBACKREST_REPO1_S3_URI_STYLE:-path}
      PGBACKREST_REPO1_CIPHER_TYPE: ${PGBACKREST_REPO1_CIPHER_TYPE:-aes-256-cbc}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?set PGBACKREST_REPO1_CIPHER_PASS}
      # archive-push runs inside this container — pg1-host must be unset (not "postgres")
      PGBACKREST_PG1_PATH: ${PGBACKREST_PG1_PATH:-/var/lib/postgresql/18/docker}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-filosign}
      PGBACKREST_PG1_DATABASE: ${POSTGRES_DB:-filosign}
      PGBACKREST_REPO1_RETENTION_FULL: ${PGBACKREST_REPO1_RETENTION_FULL:-2}
    volumes:
      # PG 18+: mount parent dir (PGDATA = /var/lib/postgresql/18/docker)
      - postgres_data:/var/lib/postgresql
      # Shared with pgbackrest sidecar — archive-push needs spool/archive.info here
      - pgbackrest_spool:/var/lib/pgbackrest
      - ./postgres/postgresql.production.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-filosign} -d ${POSTGRES_DB:-filosign}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - filosign_net

  dragonfly:
    image: ${DRAGONFLY_IMAGE:-docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.2}
    container_name: filosign-dragonfly
    restart: unless-stopped
    networks:
      - filosign_net
    # Do NOT publish 6379 to the host public interface on VPS.
    # App containers use hostname `dragonfly` on filosign_net.
    expose:
      - "6379"
    command:
      - --cluster_mode=emulated
      - --lock_on_hashtags
      - --dir=/data
      # Set maxmemory from VPS sizing (example: 2gb container → --maxmemory=1536mb); verify no eviction policy in ops doc
      - --maxmemory=1536mb
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  filosign_net:
    name: filosign-data_filosign_net

volumes:
  postgres_data:
  pgbackrest_spool:
  dragonfly_data:
