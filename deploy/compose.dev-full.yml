# Local Postgres 18 + pgBackRest (R2) + Dragonfly (BullMQ-shaped flags).
# Proof backups before VPS deploy; test queue flags before VPS.
# Usage: see deploy/README.md

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: filosign
      POSTGRES_PASSWORD: filosign
      POSTGRES_DB: filosign
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filosign -d filosign"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - filosign_dev

  pgbackrest:
    image: ${PGBACKREST_IMAGE:-percona/percona-pgbackrest:2.58.0-1}
    restart: unless-stopped
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBACKREST_STANZA: filosign
    volumes:
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # Create from pgbackrest/pgbackrest.conf.example before first up
      - postgres_data:/var/lib/postgresql:ro
      - pgbackrest_spool:/var/lib/pgbackrest
    networks:
      - filosign_dev

  dragonfly:
    image: ${DRAGONFLY_IMAGE:-docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.2}
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - --cluster_mode=emulated
      - --lock_on_hashtags
      - --dir=/data
      - --maxmemory=512mb
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - filosign_dev

networks:
  filosign_dev:
    name: filosign_dev

volumes:
  postgres_data:
  pgbackrest_spool:
  dragonfly_data:
