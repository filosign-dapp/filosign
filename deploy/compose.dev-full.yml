# Local Postgres + pgBackRest (R2). Proof backups before VPS deploy.
# Usage: see deploy/README.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: filosign-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: filosign
      POSTGRES_PASSWORD: filosign
      POSTGRES_DB: filosign
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filosign -d filosign"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - filosign_dev

  pgbackrest:
    image: pgbackrest/pgbackrest:latest
    container_name: filosign-pgbackrest-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBACKREST_STANZA: filosign
    volumes:
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # Create from pgbackrest/pgbackrest.conf.example before first up
      - postgres_data:/var/lib/postgresql/data:ro
      - pgbackrest_spool:/var/lib/pgbackrest
    networks:
      - filosign_dev

networks:
  filosign_dev:
    name: filosign_dev

volumes:
  postgres_data:
  pgbackrest_spool:
