# Optional all-in-one VPS - first Hetzner deploy shortcut (single Compose project).
# Prefer two-stack model (compose.data.yml + compose.app.yml) for Dokploy when scaling app separately.
# pgbackrest.conf: copy from pgbackrest/pgbackrest.conf.example (not committed).

x-filosign-image: &filosign-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: ${FILOSIGN_IMAGE:-filosign/server:local}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filosign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-filosign}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/postgresql.production.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-filosign} -d ${POSTGRES_DB:-filosign}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - filosign_net

  pgbackrest:
    image: ${PGBACKREST_IMAGE:-percona/percona-pgbackrest:2.58.0-1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]
    environment:
      PGBACKREST_STANZA: filosign
    volumes:
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - postgres_data:/var/lib/postgresql:ro
      - pgbackrest_spool:/var/lib/pgbackrest
    networks:
      - filosign_net

  dragonfly:
    image: ${DRAGONFLY_IMAGE:-docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.2}
    restart: unless-stopped
    networks:
      - filosign_net
    expose:
      - "6379"
    command:
      - --cluster_mode=emulated
      - --lock_on_hashtags
      - --dir=/data
      - --maxmemory=1536mb
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    <<: *filosign-image
    restart: unless-stopped
    command: ["./server"]
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    environment:
      SERVER_ROLE: api
      DRAGONFLY_URL: redis://dragonfly:6379
      PG_URI: postgresql://${POSTGRES_USER:-filosign}:${POSTGRES_PASSWORD}@postgres:5432/:dbname
      DB_NAME: ${POSTGRES_DB:-filosign}
    # Internal port 3000 only - do not publish to host when Dokploy runs on :3000. Use Domains → container 3000.
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - filosign_net

  worker:
    <<: *filosign-image
    restart: unless-stopped
    command: ["./worker"]
    healthcheck:
      test: ["CMD", "./worker-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    deploy:
      replicas: 1
    environment:
      SERVER_ROLE: worker
      DRAGONFLY_URL: redis://dragonfly:6379
      PG_URI: postgresql://${POSTGRES_USER:-filosign}:${POSTGRES_PASSWORD}@postgres:5432/:dbname
      DB_NAME: ${POSTGRES_DB:-filosign}
    networks:
      - filosign_net

networks:
  filosign_net:
    name: filosign_net

volumes:
  postgres_data:
  pgbackrest_spool:
  dragonfly_data:
