# Non-secret pgBackRest defaults (baked into filosign-postgres image).
# S3 credentials + cipher pass come from PGBACKREST_* env at runtime (Dokploy).

[global]
repo1-type=s3
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-retention-full=2
repo1-cipher-type=aes-256-cbc
start-fast=y
archive-timeout=300
process-max=1
lock-path=/var/lib/pgbackrest/lock
log-path=/var/lib/pgbackrest/log
log-level-console=info

[filosign]
pg1-path=/var/lib/postgresql/18/docker
