# Production data stack (compose.data.yml / compose.production.yml)
# PITR via pgBackRest - see project/ops/postgres-ops.md
listen_addresses = '*'
archive_mode = on
# Close and archive the current WAL segment after 5m of inactivity on that segment.
# Must be set (not 0): otherwise a quiet DB can hold one 16MB segment open for hours.
# 300 matches pgbackrest.conf archive-timeout and balances R2 PUTs vs RPO.
archive_timeout = 300
wal_level = replica
max_wal_size = 1GB
archive_command = 'pgbackrest --stanza=filosign archive-push %p'
max_wal_senders = 3
