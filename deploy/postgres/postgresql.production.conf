# Production data stack (compose.data.yml / compose.production.yml)
# PITR via pgBackRest — see project/ops/postgres-pgbackrest-dokploy.md
listen_addresses = '*'
archive_mode = on
wal_level = replica
max_wal_size = 1GB
archive_command = 'pgbackrest --stanza=filosign --spool-path=/var/lib/pgbackrest archive-push %p'
max_wal_senders = 3
